# =============================================================================
# CI/CD Pipeline - Smart Inventory System (SISIE)
#
# Stage 5: Build -> Test/JaCoCo -> Security Scan -> Docker Build & Push
#
# Branch strategy:
#   dev    : quality gates only (build, tests, security scan)
#   main   : quality gates + Docker images pushed to GHCR (production artifacts)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read      # standard: runner may read the repository
  packages: write     # needed to push images to GitHub Container Registry (GHCR)

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Build & Test
  # Compiles the Spring Boot backend, runs all unit tests and generates the
  # JaCoCo coverage report (configured in pom.xml). The report is uploaded as
  # a build artifact so it can be downloaded from the Actions UI.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (JaCoCo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # caches ~/.m2 between runs -> much faster builds

      - name: Build + run tests + JaCoCo report
        run: mvn -B verify
        # 'verify' = full lifecycle: compile -> test (surefire) -> jacoco:report
      
      - name: Repository name must be lowercase
        run: |
          echo "REPO_OWNER_LOWERCASE=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
        

      - name: Upload JaCoCo coverage report
        if: always() # keep the artifact even when tests fail
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: src/backend/target/site/jacoco/

      - name: Upload backend JAR (for security scan)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: sisie-backend-jar
          path: src/backend/target/*.jar

  # ---------------------------------------------------------------------------
  # JOB 2: Security Scan
  # Trivy (Aqua Security) scans the ACTUAL production artifact - the Spring
  # Boot fat JAR built by job 1 - for known vulnerabilities (CVEs) in all
  # bundled dependencies. Scanning the JAR (instead of the source directory)
  # also avoids Maven Central rate limits (HTTP 429) on shared GitHub runner
  # IPs, because no remote dependency resolution is needed.
  # HIGH/CRITICAL findings fail the pipeline - a quality gate, not just a report.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-test # only scan code that already compiled and passed tests
    steps:
      - name: Download backend JAR from build job
        uses: actions/download-artifact@v5
        with:
          name: sisie-backend-jar
          path: src/backend/target/

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan production JAR (HIGH, CRITICAL)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 src/backend/target/*.jar

  # ---------------------------------------------------------------------------
  # JOB 3: Docker Build & Push (main only)
  # Builds both multi-stage images and pushes them to GHCR, tagged with the
  # commit SHA (traceable artifact) plus 'latest'. This is the production
  # artifact - the same image that runs locally via docker compose.
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided by GitHub, no secret setup needed

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ REPO_OWNER_LOWERCASE }}/sisie-backend:${{ github.sha }}
            ghcr.io/${{ REPO_OWNER_LOWERCASE }}/sisie-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ REPO_OWNER_LOWERCASE}}/sisie-frontend:${{ github.sha }}
            ghcr.io/${{ REPO_OWNER_LOWERCASE}}/sisie-frontend:latest
