<!-- BUG 1: <aside.login-status> missing space and class -> <aside class="..."> -->
<aside class="status-bar">
  <!-- BUG 2: isAuthenticated is a SIGNAL — in the template we call it like a function: isAuthenticated() -->
  @if (isAuthenticated()) {
    <div>
      <!-- BUG 3: AuthService.username does not exist — added getUsername(), exposed as username() -->
      <h3>{{ username() }}</h3>
      <!-- logout() by itself does no redirect — onLogout() = logout + navigate('/login') -->
      <button type="button" (click)="onLogout()">Logout</button>
    </div>
  } @else {
    <!-- BUG 4: <a href="/login"> = full page reload. routerLink = SPA, no reload -->
    <a routerLink="/login">Go to login page</a>
  }
</aside>
