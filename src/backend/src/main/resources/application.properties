

# Datenbank-Verbindung fur SQLite
spring.datasource.url=jdbc:sqlite:sisie_database.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Einstellungen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Configuration
sisie.jwt.secret=MeinSuperGeheimerSchlusselDerSehrLangSeinMuss@1234567890#
# time in miliseconds
sisie.jwt.expiration= 86400000

# Sever port - Standard ist 8080
server.port=8888